name: Test Gameplay Hunter

on:
  pull_request:
    paths:
      - "tools/gameplay_hunter/**"
      - "tests/test_gameplay_hunter.py"
      - ".github/workflows/test-gameplay-hunter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Run Gameplay Hunter unit tests
        run: python tests/test_gameplay_hunter.py -v
      - name: Compile discovery script
        run: python -m py_compile tools/gameplay_hunter/discover_commons.py

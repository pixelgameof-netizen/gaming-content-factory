name: Test generic renderer with synthetic media

# CI also exercises rejection of unreviewed scene files and invalid MP4 outputs.
on:
  push:
    paths:
      - 'render/render_generic.sh'
      - 'render/quality_check.py'
      - 'render/upload_supabase_tus.py'
      - 'render/generate_voiceover.py'
      - 'tests/**'
      - 'supabase/functions/gcf-render-job-assets/**'
      - 'supabase/functions/gcf-render-job-output/**'
      - 'supabase/migrations/**'
      - '.github/workflows/render-job.yml'
      - '.github/workflows/test-render-generic.yml'
  pull_request:
    paths:
      - 'render/render_generic.sh'
      - 'render/quality_check.py'
      - 'render/upload_supabase_tus.py'
      - 'tests/**'
      - 'supabase/functions/gcf-render-job-assets/**'
      - 'supabase/functions/gcf-render-job-output/**'
      - 'supabase/migrations/**'
      - '.github/workflows/render-job.yml'
      - '.github/workflows/test-render-generic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Type-check dynamic render worker functions
        run: |
          deno check supabase/functions/gcf-render-job-assets/index.ts
          deno check supabase/functions/gcf-render-job-output/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Spanish Kokoro narration and subtitle generation
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "kokoro-onnx==0.6.1" "misaki-fork[en]==0.9.6" "soundfile==0.13.1"
          MODEL="$RUNNER_TEMP/kokoro-v1.0.int8.onnx"
          VOICES="$RUNNER_TEMP/voices-v1.0.bin"
          curl --fail --silent --show-error --location "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx" --output "$MODEL"
          curl --fail --silent --show-error --location "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" --output "$VOICES"
          echo "ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  $MODEL" | sha256sum --check
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  $VOICES" | sha256sum --check
          printf '%s\n' 'Este es un guion de prueba para comprobar que la narración en español se genera correctamente y que los subtítulos quedan sincronizados con el audio.' > "$RUNNER_TEMP/voiceover-test.txt"
          python3 render/generate_voiceover.py --script "$RUNNER_TEMP/voiceover-test.txt" --model "$MODEL" --voices "$VOICES" --audio "$RUNNER_TEMP/voiceover-test.wav" --captions "$RUNNER_TEMP/voiceover-test.srt"
          test -s "$RUNNER_TEMP/voiceover-test.wav"
          test -s "$RUNNER_TEMP/voiceover-test.srt"
          python3 - <<'PY'
          import os
          import soundfile as sf
          info = sf.info(os.path.join(os.environ["RUNNER_TEMP"], "voiceover-test.wav"))
          assert info.samplerate == 24000 and info.channels == 1
          PY
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: |
          bash -n render/render_generic.sh
          python3 -m py_compile render/quality_check.py render/upload_supabase_tus.py render/generate_voiceover.py
          python3 -m unittest discover -s tests -v
      - name: Generate synthetic test inputs
        run: |
          mkdir -p production/renderer-test/media artifacts
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x18243a:s=360x640:d=2:r=24 -an -c:v libx264 -pix_fmt yuv420p production/renderer-test/media/scene-01.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x324a62:s=360x640:d=2:r=24 -an -c:v libx264 -pix_fmt yuv420p production/renderer-test/media/scene-02.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:duration=4 -c:a pcm_s16le production/renderer-test/media/voiceover.wav
          cat > production/renderer-test/rights-review.json <<'JSON'
          {
            "episode": "renderer-test",
            "assets": [{
              "file": "scene-01.mp4",
              "status": "approved",
              "commercial_use_confirmed": true,
              "publisher_policy_verified": true,
              "third_party_assets_verified": true,
              "music_rights_verified": true,
              "reviewer_approved": true,
              "source_url": "synthetic://generated-test",
              "license_url": "synthetic://generated-test"
            }, {
              "file": "scene-02.mp4",
              "status": "approved",
              "commercial_use_confirmed": true,
              "publisher_policy_verified": true,
              "third_party_assets_verified": true,
              "music_rights_verified": true,
              "reviewer_approved": true,
              "source_url": "synthetic://generated-test",
              "license_url": "synthetic://generated-test"
            }]
          }
          JSON
          cat > production/renderer-test/rights-review.json.tmp <<'JSON'
          {"voiceover":{"status":"approved","rights_confirmed":true,"reviewer_approved":true}}
          JSON
          python3 - <<'PY'
          import json
          p="production/renderer-test/rights-review.json"
          d=json.load(open(p))
          d.update(json.load(open(p+".tmp")))
          json.dump(d,open(p,"w"))
          PY
      - name: Render synthetic vertical test
        run: bash render/render_generic.sh renderer-test vertical artifacts/renderer-test.mp4
      - name: Run positive quality gate
        run: |
          python3 render/quality_check.py artifacts/renderer-test.mp4 --aspect 9:16 --report artifacts/renderer-test.qc.json
          python3 - <<'PY'
          import json
          report=json.load(open("artifacts/renderer-test.qc.json"))
          assert report["status"] == "passed"
          assert len(report["sha256"]) == 64
          assert report["width"] == 1080 and report["height"] == 1920
          assert "audio_video_sync" in report["checks"]
          PY
      - name: Reject output without audio
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x526070:s=1080x1920:d=2:r=30 -an -c:v libx264 -pix_fmt yuv420p artifacts/silent.mp4
          if python3 render/quality_check.py artifacts/silent.mp4 --aspect 9:16 --report artifacts/silent.qc.json; then
            echo "Quality gate accepted output without audio" >&2
            exit 1
          fi
          test ! -e artifacts/silent.qc.json
      - name: Reject scene without rights approval
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x526070:s=360x640:d=1:r=24 -an -c:v libx264 -pix_fmt yuv420p production/renderer-test/media/scene-03.mp4
          if bash render/render_generic.sh renderer-test vertical artifacts/should-not-exist.mp4; then
            echo "Renderer accepted an unreviewed scene" >&2
            exit 1
          fi
          test ! -e artifacts/should-not-exist.mp4
      - name: Assert output metadata
        run: |
          test -s artifacts/renderer-test.mp4
          test -s artifacts/renderer-test.mp4.sha256
          test -s artifacts/renderer-test.qc.json
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 artifacts/renderer-test.mp4)" = "1080x1920"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-synthetic-test
          path: artifacts/renderer-test.*
          retention-days: 1

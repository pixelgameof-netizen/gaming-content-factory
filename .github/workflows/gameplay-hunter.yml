name: Discover licensed gameplay candidates
# Owner-initiated push validation is authenticated by the importer OIDC allowlist.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gameplay-hunter.yml"
      - "tools/gameplay_hunter/**"
  workflow_dispatch:
    inputs:
      games:
        description: "Comma-separated game titles (leave empty for the default multi-game list)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gameplay-hunter
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned discovery dependency
        run: python -m pip install requests==2.32.5
      - name: Discover candidates from Wikimedia Commons
        id: discover
        env:
          GAME_QUERIES: ${{ inputs.games }}
        run: |
          set -euo pipefail
          if [ -n "$GAME_QUERIES" ]; then
            python tools/gameplay_hunter/discover_commons.py --games "$GAME_QUERIES"
          else
            python tools/gameplay_hunter/discover_commons.py
          fi
          python - "$GAME_QUERIES" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          requested = sys.argv[1].strip()
          games = [part.strip().casefold() for part in re.split(r"[,;\n]+", requested) if part.strip()]
          if not requested:
              games = ["minecraft", "fortnite", "roblox", "grand theft auto", "counter-strike", "valorant"]
          print("stage_curated_minecraft=" + ("true" if "minecraft" in games else "false"))
          PY
      - name: Upload candidate catalog
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-candidates-${{ github.run_id }}
          path: artifacts/gameplay-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: Register candidate metadata in private Supabase catalog
        env:
          SUPABASE_URL: https://pyrrcfegucvxyxlxzowu.supabase.co
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=gcf-import-gameplay-candidates" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          OIDC_TOKEN="$(jq -er '.value' <<<"$OIDC_RESPONSE")"
          jq '{candidates: .candidates}' artifacts/gameplay-candidates.json \
            > "$RUNNER_TEMP/gcf-hunter-import.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/gcf-hunter-import.json" \
            "$SUPABASE_URL/functions/v1/gcf-import-gameplay-candidates" \
            --output "$RUNNER_TEMP/gcf-hunter-import-result.json"
          cat "$RUNNER_TEMP/gcf-hunter-import-result.json"
          jq -e '(.errors | length) == 0' "$RUNNER_TEMP/gcf-hunter-import-result.json" >/dev/null
          unset OIDC_TOKEN OIDC_RESPONSE ACTIONS_ID_TOKEN_REQUEST_TOKEN

      # Retryable and idempotent: service_role has only the table access needed for private staging.
      - name: Stage curated Minecraft gameplay in private review storage
        if: steps.discover.outputs.stage_curated_minecraft == 'true'
        env:
          SUPABASE_URL: https://pyrrcfegucvxyxlxzowu.supabase.co
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=gcf-stage-gameplay-candidates" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          OIDC_TOKEN="$(jq -er '.value' <<<"$OIDC_RESPONSE")"
          jq -n --argjson ids '[
            "3f2333f2-0f01-40d8-82dd-eb92acd5a144",
            "71730fcd-c7ec-4432-b3a4-54fe92f11599",
            "fc800ea8-d298-4da0-a2fc-582290d86c01",
            "fc2330bf-11a9-446f-94ec-f91dac29ba47",
            "34ae3b20-7e17-4958-a682-c44775cfef33"
          ]' '{source_ids: $ids}' > "$RUNNER_TEMP/gcf-stage-gameplay.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/gcf-stage-gameplay.json" \
            "$SUPABASE_URL/functions/v1/gcf-stage-gameplay-candidates" \
            --output "$RUNNER_TEMP/gcf-stage-gameplay-result.json"
          cat "$RUNNER_TEMP/gcf-stage-gameplay-result.json"
          jq -e '(.errors | length) == 0 and (.rejected | length) == 0' "$RUNNER_TEMP/gcf-stage-gameplay-result.json" >/dev/null
          unset OIDC_TOKEN OIDC_RESPONSE ACTIONS_ID_TOKEN_REQUEST_TOKEN
      - name: Inspect staged gameplay media with PyAV and create visual review frames
        if: steps.discover.outputs.stage_curated_minecraft == 'true'
        env:
          SUPABASE_URL: https://pyrrcfegucvxyxlxzowu.supabase.co
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install av==16.0.1 pillow==12.0.0
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --get --data-urlencode "audience=gcf-inspect-gameplay-candidates" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          OIDC_TOKEN="$(jq -er '.value' <<<"$OIDC_RESPONSE")"
          jq -n '{mode:"prepare"}' > "$RUNNER_TEMP/gcf-inspect-prepare.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/gcf-inspect-prepare.json" \
            "$SUPABASE_URL/functions/v1/gcf-inspect-gameplay-candidates" \
            --output "$RUNNER_TEMP/gcf-inspect-assets.json"
          jq -e '.assets | length == 5' "$RUNNER_TEMP/gcf-inspect-assets.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/gcf-gameplay-qc" artifacts/gameplay-review-frames
          : > "$RUNNER_TEMP/gcf-gameplay-qc-results.ndjson"
          while IFS= read -r item; do
            SOURCE_ID="$(jq -r '.source_id' <<<"$item")"
            TITLE="$(jq -r '.title' <<<"$item")"
            EXPECTED_SHA="$(jq -r '.sha256' <<<"$item")"
            SIGNED_URL="$(jq -r '.signed_url' <<<"$item")"
            VIDEO_FILE="$RUNNER_TEMP/gcf-gameplay-qc/$SOURCE_ID.webm"
            curl --fail --location --silent --show-error --max-time 120 "$SIGNED_URL" --output "$VIDEO_FILE"
            ACTUAL_SHA="$(sha256sum "$VIDEO_FILE" | awk '{print $1}')"
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            python - "$VIDEO_FILE" "$SOURCE_ID" "$TITLE" "$ACTUAL_SHA" "artifacts/gameplay-review-frames" >> "$RUNNER_TEMP/gcf-gameplay-qc-results.ndjson" <<'PY'
          import json, sys, av
          from pathlib import Path
          path, source_id, title, sha256, frame_dir = sys.argv[1:]
          container = av.open(path, mode="r")
          try:
              videos = [s for s in container.streams if s.type == "video"]
              audios = [s for s in container.streams if s.type == "audio"]
              if not videos:
                  raise SystemExit("No video stream detected")
              video = videos[0]
              duration = (container.duration / av.time_base) if container.duration else (
                  float(video.duration * video.time_base) if video.duration and video.time_base else 0
              )
              if duration <= 0:
                  raise SystemExit("Video duration unavailable")
              saved = set()
              for frame in container.decode(video):
                  seconds = float(frame.pts * frame.time_base) if frame.pts is not None else 0.0
                  for target in (2, 6):
                      if target not in saved and seconds >= target:
                          image = frame.to_image().convert("RGB")
                          image.thumbnail((720, 720))
                          output = Path(frame_dir) / f"{source_id}-{target:02d}s.jpg"
                          image.save(output, format="JPEG", quality=88, optimize=True)
                          saved.add(target)
              if len(saved) < 2:
                  raise SystemExit("Could not extract both requested visual review frames")
              result = {
                  "source_id": source_id, "title": title, "sha256": sha256,
                  "duration_seconds": round(float(duration), 3),
                  "width": int(video.width), "height": int(video.height),
                  "video_codec": video.codec_context.name,
                  "fps": str(video.average_rate or "unknown"),
                  "has_audio": bool(audios),
                  "audio_codec": audios[0].codec_context.name if audios else None
              }
              print(json.dumps(result, separators=(",", ":")))
          finally:
              container.close()
          PY
          done < <(jq -c '.assets[]' "$RUNNER_TEMP/gcf-inspect-assets.json")
          jq -s '.' "$RUNNER_TEMP/gcf-gameplay-qc-results.ndjson" > "$RUNNER_TEMP/gcf-gameplay-qc-results.json"
          jq -n --slurpfile rows "$RUNNER_TEMP/gcf-gameplay-qc-results.json" '{mode:"report",results:$rows[0]}' \
            > "$RUNNER_TEMP/gcf-inspect-report.json"
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/gcf-inspect-report.json" \
            "$SUPABASE_URL/functions/v1/gcf-inspect-gameplay-candidates" \
            --output "$RUNNER_TEMP/gcf-gameplay-qc-report.json"
          cat "$RUNNER_TEMP/gcf-gameplay-qc-report.json"
          jq -e '(.rejected | length) == 0 and (.saved | length == 5)' \
            "$RUNNER_TEMP/gcf-gameplay-qc-report.json" >/dev/null
          mkdir -p artifacts
          cp "$RUNNER_TEMP/gcf-gameplay-qc-results.json" artifacts/gameplay-media-qc.json
          unset OIDC_TOKEN OIDC_RESPONSE ACTIONS_ID_TOKEN_REQUEST_TOKEN

      - name: Upload private gameplay technical QC report
        if: steps.discover.outputs.stage_curated_minecraft == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-gameplay-media-qc-${{ github.run_id }}
          path: artifacts/gameplay-media-qc.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload visual review frames (not source media)
        if: steps.discover.outputs.stage_curated_minecraft == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-gameplay-visual-review-${{ github.run_id }}
          path: artifacts/gameplay-review-frames/*.jpg
          if-no-files-found: error
          retention-days: 14

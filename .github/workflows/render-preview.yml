name: Render preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-preview
  cancel-in-progress: false

jobs:
  render:
    name: Build and publish preview file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render test video
        run: |
          chmod +x render/render_preview.sh
          ./render/render_preview.sh preview.mp4

      - name: Validate video
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json preview.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 preview.mp4)" = "720"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 preview.mp4)" = "1280"

      - name: Keep one-day downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaming-content-factory-preview
          path: preview.mp4
          if-no-files-found: error
          retention-days: 1
